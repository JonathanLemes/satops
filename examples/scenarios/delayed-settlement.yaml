apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: delayed-settlement
spec:
  description: Makes the demo fintech settle deposits late. Reconciliation must keep the deposit pending inside the settlement delay instead of reporting a false discrepancy.
  assertions:
    - kind: missing_credit
      expected: 0
      source: demo-fintech
      type: reconciliation.open_discrepancies
    - amountSats: 0
      customerRef: customer
      type: fintech.balance_equals
    - type: ledger.is_balanced
  guarantee: Operations stay pending instead of being flagged while inside the settlement window
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: integration.set_fault
      id: enable-fault
      params:
        enabled: true
        mode: delayed_settlement
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 700000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-native-credit
      params:
        assertion:
          account: customer
          amountSats: 700000
          timeout: 90s
          type: ledger.balance_equals
      phase: run
      timeout: 120s
    - action: reconciliation.run
      id: reconcile
      params: {}
      phase: verify
      timeout: 150s
    - action: integration.set_fault
      id: disable-fault
      params:
        enabled: false
        mode: delayed_settlement
      phase: cleanup
  title: Delayed settlement
