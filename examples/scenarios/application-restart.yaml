apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: application-restart
spec:
  description: Restarts the supervised node monitors and verifies that ingestion and ledger state come back from PostgreSQL.
  assertions:
    - expected: true
      field: supervisorReplaced
      step: restart
      type: step.result_equals
    - timeout: 60s
      type: blockchain.synced
    - account: customer
      amountSats: 400000
      timeout: 90s
      type: ledger.balance_equals
    - type: ledger.is_balanced
  guarantee: Persistent state is preserved across process restarts
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 400000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-credit
      params:
        assertion:
          account: customer
          amountSats: 400000
          timeout: 90s
          type: ledger.balance_equals
      phase: run
      timeout: 120s
    - action: platform.restart_processes
      id: restart
      params: {}
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-after-restart
      params:
        count: 1
      phase: run
    - action: satwatch.sync_now
      id: ingest-after-restart
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
  title: Application restart
