apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: duplicate-deposit
spec:
  description: "Delivers the same confirmed deposit events 100 times to the ledger consumer (at-least-once delivery) and checks that only one credit exists."
  assertions:
    - account: customer
      amountSats: 1500000
      timeout: 90s
      type: ledger.balance_equals
    - expected: 0
      type: ledger.duplicate_credits
    - type: ledger.is_balanced
    - account: customer
      expected: 0
      source: native-ledger
      type: reconciliation.open_discrepancies
  guarantee: One deposit produces exactly the expected net credit
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 1500000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-credit
      params:
        assertion:
          account: customer
          amountSats: 1500000
          timeout: 90s
          type: ledger.balance_equals
      phase: run
      timeout: 120s
    - action: events.duplicate_delivery
      id: redeliver-events
      params:
        times: 100
      phase: run
      timeout: 300s
    - action: reconciliation.run
      id: reconcile
      params: {}
      phase: verify
      timeout: 150s
  title: Duplicate deposit
