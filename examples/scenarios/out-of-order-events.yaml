apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: out-of-order-events
spec:
  description: "Re-delivers the run's transaction and block events to the ledger consumer in a shuffled, reversed order."
  assertions:
    - account: customer
      amountSats: 1500000
      timeout: 90s
      type: ledger.balance_equals
    - expected: 0
      type: ledger.duplicate_credits
    - type: ledger.is_balanced
  guarantee: Financial state is not corrupted by event reordering
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 1500000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-credit
      params:
        assertion:
          account: customer
          amountSats: 1500000
          timeout: 90s
          type: ledger.balance_equals
      phase: run
      timeout: 120s
    - action: events.out_of_order_delivery
      id: shuffle
      params: {}
      phase: run
      timeout: 120s
  title: Out-of-order events
