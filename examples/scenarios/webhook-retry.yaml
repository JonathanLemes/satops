apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: webhook-retry
spec:
  description: Re-sends the latest signed webhooks five times with the same delivery ids. SatOps must accept each delivery once.
  assertions:
    - expected: 0
      field: accepted
      step: redeliver
      type: step.result_equals
    - atLeast: 1
      type: integration.webhook_receipts
  guarantee: Retried webhooks do not produce duplicate effects when the consumer is idempotent
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 300000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-fintech
      params:
        assertion:
          amountSats: 300000
          customerRef: customer
          timeout: 90s
          type: fintech.balance_equals
      phase: run
      timeout: 120s
    - action: integration.deliver_event
      id: deliver
      params: {}
      phase: run
    - action: integration.redeliver_event
      id: redeliver
      params:
        last: 5
        times: 5
      phase: run
  title: Webhook retry
