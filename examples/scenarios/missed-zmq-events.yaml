apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: missed-zmq-events
spec:
  description: "Stops the node monitors (dropping ZeroMQ notifications), produces transactions and blocks, then restarts the monitors. RPC backfill must rebuild the confirmed state."
  assertions:
    - expected: 3
      timeout: 60s
      transactionRef: deposit-001
      type: blockchain.confirmations
    - account: customer
      amountSats: 600000
      timeout: 90s
      type: ledger.balance_equals
    - type: ledger.is_balanced
  guarantee: Confirmed state is rebuilt through RPC after notifications are lost
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: satwatch.suspend_monitor
      id: stop-monitor-0
      params:
        node: bitcoin-0
      phase: run
    - action: satwatch.suspend_monitor
      id: stop-monitor-1
      params:
        node: bitcoin-1
      phase: run
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 600000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.resume_monitor
      id: resume-monitor-0
      params:
        node: bitcoin-0
      phase: run
    - action: satwatch.resume_monitor
      id: resume-monitor-1
      params:
        node: bitcoin-1
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: satwatch.resume_monitor
      id: resume-monitor-cleanup
      params:
        node: bitcoin-0
      phase: cleanup
  title: Missed ZeroMQ events
