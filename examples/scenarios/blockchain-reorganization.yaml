apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: blockchain-reorganization
spec:
  description: "Confirms a deposit, invalidates the block that contains it and mines a heavier replacement chain. The ledger must reverse the original credit and credit again only after the new confirmations."
  assertions:
    - expected: confirmed
      timeout: 60s
      transactionRef: deposit-001
      type: blockchain.transaction_status
    - expected: 3
      timeout: 60s
      transactionRef: deposit-001
      type: blockchain.confirmations
    - account: customer
      amountSats: 1500000
      timeout: 90s
      type: ledger.balance_equals
    - expected: 0
      type: ledger.duplicate_credits
    - type: ledger.is_balanced
  guarantee: Confirmation changes are recognized and financial effects follow them
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 1500000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-credit
      params:
        assertion:
          account: customer
          amountSats: 1500000
          timeout: 90s
          type: ledger.balance_equals
      phase: run
      timeout: 120s
    - action: bitcoin.reorganize_chain
      id: reorganize
      params:
        depth: 3
        extraBlocks: 1
      phase: run
    - action: satwatch.sync_now
      id: ingest-reorg
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: reconciliation.run
      id: reconcile
      params: {}
      phase: verify
      timeout: 150s
  title: Blockchain reorganization
