apiVersion: satops.io/v1alpha1
kind: Experiment
metadata:
  name: concurrent-withdrawals
spec:
  description: "Funds a customer with 20,000 sats and fires 10 concurrent withdrawals of 5,000 sats against the native ledger on independent database connections."
  assertions:
    - expected: 4
      field: accepted
      step: withdraw
      type: step.result_equals
    - expected: 0
      field: errors
      step: withdraw
      type: step.result_equals
    - account: customer
      amountSats: 0
      type: ledger.balance_equals
    - account: customer
      amountSats: 20000
      bucket: reserved
      type: ledger.balance_equals
    - type: ledger.is_balanced
  guarantee: Available balance is never spent twice
  steps:
    - action: bitcoin.ensure_funds
      id: fund-wallet
      params:
        minimumSats: 500000000
      phase: prepare
      timeout: 120s
    - action: integration.create_customer
      id: create-customer
      maxAttempts: 3
      params:
        name: Scenario customer
        as: customer
      phase: prepare
    - action: integration.request_deposit_address
      id: deposit-address
      maxAttempts: 3
      params:
        as: deposit_address
        customerRef: customer
      phase: prepare
    - action: bitcoin.send_transaction
      id: send-deposit
      params:
        amountSats: 20000
        as: deposit-001
        toRef: deposit_address
      phase: run
    - action: bitcoin.mine_blocks
      id: mine-confirmations
      params:
        count: 3
      phase: run
    - action: satwatch.sync_now
      id: ingest
      maxAttempts: 2
      params: {}
      phase: run
      timeout: 90s
    - action: assert.evaluate
      id: wait-credit
      params:
        assertion:
          account: customer
          amountSats: 20000
          timeout: 90s
          type: ledger.balance_equals
      phase: run
      timeout: 120s
    - action: ledger.concurrent_withdrawals
      id: withdraw
      params:
        accountRef: customer
        amountSats: 5000
        concurrency: 10
      phase: run
  title: Concurrent withdrawals
