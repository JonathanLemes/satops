name: Extended resilience

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  scenarios:
    name: SatLab scenarios on the full stack
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY_BASE=.*/SECRET_KEY_BASE=$(openssl rand -hex 48)/" .env
          sed -i "s/^SATOPS_SECRET_KEY=.*/SATOPS_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - run: docker compose up -d --build --wait
      - name: Create administrator
        id: admin
        run: |
          OUT=$(docker compose exec -T api /app/bin/sat_ops rpc 'SatOps.Release.create_admin("ci@example.test")')
          echo "password=$(echo "$OUT" | sed -n 's/.*(shown once): //p')" >> "$GITHUB_OUTPUT"
      - name: Run scenarios
        run: tests/resilience/run-scenarios.sh ci@example.test "${{ steps.admin.outputs.password }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-reports
          path: tests/resilience/reports
  backend-resilience:
    name: Concurrency and crash tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      MIX_ENV: test
      TEST_DATABASE_URL: ecto://postgres:postgres@localhost:5432/satops_test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3.4"
      - run: mix deps.get
      - run: mix test --only resilience
