name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: Critical flows on the full stack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i "s/^SECRET_KEY_BASE=.*/SECRET_KEY_BASE=$(openssl rand -base64 64 | tr -d '\n')/" .env
          sed -i "s/^SATOPS_SECRET_KEY=.*/SATOPS_SECRET_KEY=$(openssl rand -base64 32 | tr -d '\n')/" .env
      - run: docker compose up -d --build --wait
      - name: Create administrator
        id: admin
        run: |
          OUT=$(docker compose exec -T api /app/bin/sat_ops rpc 'SatOps.Release.create_admin("e2e@example.test")')
          echo "password=$(echo "$OUT" | sed -n 's/.*(shown once): //p')" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @satops/web exec playwright install --with-deps chromium
      - run: pnpm --filter @satops/web test:e2e
        env:
          SATOPS_E2E_URL: http://127.0.0.1:8470
          SATOPS_E2E_EMAIL: e2e@example.test
          SATOPS_E2E_PASSWORD: ${{ steps.admin.outputs.password }}
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            compose.log
            apps/web/playwright-report
