name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { name: api, file: deploy/docker/api.Dockerfile, context: ., target: runtime }
          - { name: web, file: deploy/docker/web.Dockerfile, context: ., target: runtime }
          - { name: demo-fintech, file: examples/demo-fintech/Dockerfile, context: examples/demo-fintech, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/satops-${{ matrix.name }}:${{ github.ref_name }}
