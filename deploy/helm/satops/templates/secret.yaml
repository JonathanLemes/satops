{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "satops.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $s := .Values.secrets }}
  secretKeyBase: {{ required "secrets.secretKeyBase is required (or use existingSecret)" $s.secretKeyBase | quote }}
  satopsSecretKey: {{ required "secrets.satopsSecretKey is required" $s.satopsSecretKey | quote }}
  postgresPassword: {{ required "secrets.postgresPassword is required" $s.postgresPassword | quote }}
  satopsDbPassword: {{ required "secrets.satopsDbPassword is required" $s.satopsDbPassword | quote }}
  demoFintechDbPassword: {{ required "secrets.demoFintechDbPassword is required" $s.demoFintechDbPassword | quote }}
  bitcoinRpcPassword: {{ required "secrets.bitcoinRpcPassword is required" $s.bitcoinRpcPassword | quote }}
  demoFintechApiToken: {{ required "secrets.demoFintechApiToken is required" $s.demoFintechApiToken | quote }}
  demoFintechWebhookSecret: {{ required "secrets.demoFintechWebhookSecret is required" $s.demoFintechWebhookSecret | quote }}
{{- end }}
