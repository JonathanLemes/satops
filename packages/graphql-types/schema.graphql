schema {
  mutation: RootMutationType
  query: RootQueryType
}

type RootQueryType {
  environments: [Environment!]!
  environment(id: ID!): Environment
  integrations(environmentId: ID!, kind: String): [Integration!]!
  integration(id: ID!): Integration
  integrationKinds: [String!]!
  secretNames(environmentId: ID!): [String!]!
  auditLog(environmentId: ID, action: String, resourceId: String, correlationId: ID, beforeId: Int, limit: Int): [AuditEntry!]!
  events(environmentId: ID!, types: [String!], aggregateId: String, correlationId: ID, beforeSeq: Int, limit: Int): [DomainEvent!]!
  eventConsumers: [ConsumerCheckpoint!]!
  jobStats: [JobStat!]!
  jobs(state: String, queue: String, limit: Int): [Job!]!
  users: [User!]!
  nodes(environmentId: ID!): [NodeStatus!]!
  chainOverview(environmentId: ID!): ChainOverview!
  blocks(environmentId: ID!, beforeHeight: Int, limit: Int, includeStale: Boolean): [Block!]!
  transactions(environmentId: ID!, filter: TransactionFilter, first: Int, after: String): TransactionConnection!
  transaction(environmentId: ID!, txid: String!): Transaction
  transactionVolume(environmentId: ID!, hours: Int): [VolumeBucket!]!
  wallets(environmentId: ID!): [Wallet!]!
  portfolio(environmentId: ID!, walletIds: [ID!]): Portfolio!
  ledgerAccounts(environmentId: ID!): [LedgerAccount!]!
  journals(environmentId: ID!, operationId: String, correlationId: ID, before: DateTime, limit: Int): [Journal!]!
  ledgerOperations(environmentId: ID!, kind: String, state: String, txid: String, limit: Int): [LedgerOperation!]!
  customerBalances(environmentId: ID!): [CustomerBalance!]!
  ledgerInvariants(environmentId: ID!): LedgerInvariants!
  financialRules: [FinancialRule!]!
  operationTimeline(environmentId: ID!, operationId: String!): OperationTimeline!
  reconciliationRuns(environmentId: ID!, limit: Int): [ReconciliationRun!]!
  reconciliationRun(id: ID!): ReconciliationRun
  discrepancies(environmentId: ID!, states: [String!], kind: String, limit: Int): [Discrepancy!]!
  discrepancy(id: ID!): Discrepancy
  overview(environmentId: ID!): Overview!
  scenarios: [Scenario!]!
  scenario(id: ID!): Scenario
  experimentRuns(environmentId: ID!, limit: Int): [ExperimentRun!]!
  experimentRun(id: ID!): ExperimentRun
  experimentActions: [ActionDescriptor!]!
  runtimeCapabilities(environmentId: ID!): [String!]!
  configResources(kind: String): [ConfigResource!]!
  configResource(kind: String!, name: String!): ConfigResource
  configSchema(kind: String!): JSON!
  dashboards(workspace: String!): [Dashboard!]!
  widgetTypes: [WidgetType!]!
  alertPolicies(environmentId: ID!): [AlertPolicy!]!
  alerts(environmentId: ID!, state: String, limit: Int): [AlertOccurrence!]!
  me: User
}

type RootMutationType {
  createEnvironment(slug: String!, name: String!, requiredConfirmations: Int): Environment
  saveIntegration(environmentId: ID!, input: IntegrationInput!): Integration
  deleteIntegration(id: ID!): Boolean
  testIntegration(id: ID!): ConnectionTest
  putSecret(environmentId: ID!, name: String!, value: String!): Boolean
  createUser(email: String!, name: String!, role: String!, password: String!, environmentId: ID): User
  updateUser(id: ID!, role: String, disabled: Boolean): User
  setMembership(userId: ID!, environmentId: ID!, role: String!): Boolean
  updateLocale(locale: String!): User
  replayEvents(consumer: String!, fromSeq: Int!): Boolean
  createWallet(environmentId: ID!, input: WalletInput!): Wallet
  addWatchedAddress(walletId: ID!, address: String!, label: String): Wallet
  deleteWallet(id: ID!): Boolean
  syncChain(environmentId: ID!): Boolean
  requestWithdrawal(environmentId: ID!, accountRef: String!, amountSats: Sats!, feeSats: Sats, idempotencyKey: String!): PostingResult
  settleWithdrawal(environmentId: ID!, idempotencyKey: String!, outcome: String!, txid: String, reason: String): PostingResult
  internalTransfer(environmentId: ID!, fromRef: String!, toRef: String!, amountSats: Sats!, idempotencyKey: String!): PostingResult
  compensateJournal(environmentId: ID!, journalId: ID!, reason: String!): PostingResult
  runReconciliation(environmentId: ID!): ReconciliationRun
  transitionDiscrepancy(id: ID!, state: String!, note: String): Discrepancy
  addDiscrepancyNote(id: ID!, body: String!, kind: String, data: JSON): DiscrepancyNote
  startExperiment(environmentId: ID!, scenarioId: ID!, seed: Int): ExperimentRun
  abortExperiment(id: ID!): ExperimentRun
  validateConfig(yaml: String, document: JSON): ConfigValidation!
  planConfig(document: JSON!): ConfigPlan
  applyConfig(document: JSON!, expectedRevision: Int, message: String): ConfigApplyResult
  reapplyConfig(kind: String!, name: String!, revision: Int!): ConfigApplyResult
  deleteConfig(kind: String!, name: String!): Boolean
  saveDashboard(name: String!, spec: JSON!, lockVersion: Int): Dashboard
  deleteDashboard(id: ID!): Boolean
  restoreDefaultDashboard(workspace: String!): Dashboard
  saveAlertPolicy(environmentId: ID!, input: AlertPolicyInput!): AlertPolicy
  deleteAlertPolicy(id: ID!): Boolean
  updateAlert(id: ID!, action: String!): AlertOccurrence
  retryAlertDelivery(id: ID!): Boolean
}

